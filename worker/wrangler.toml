# ตั้งค่า Cloudflare Worker — GEMBA SAFETY API
#
# ⚠️ ห้ามใส่ค่าลับในไฟล์นี้ ไฟล์นี้ถูก commit ขึ้น repo
#    AUTH_TOKEN ต้องตั้งด้วย `wrangler secret put AUTH_TOKEN` เท่านั้น
#    ตอนพัฒนาในเครื่องให้ใส่ไว้ที่ .dev.vars ซึ่งถูก gitignore ไว้แล้ว

name = "gemba-safety-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ── ฐานข้อมูล D1 ──────────────────────────────────────────────────────────
# database_id ได้จากผลลัพธ์ของ  npx wrangler d1 create gemba-safety
# ต้องเอามาใส่แทนค่าด้านล่างก่อน deploy ครั้งแรก
[[d1_databases]]
binding = "DB"
database_name = "gemba-safety"
database_id = "8a51ba3b-8982-4916-ae2d-4b997e095200"

# ── ที่เก็บรูปหน้างานและรูปหลังแก้ไข R2 ───────────────────────────────────
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "gemba-safety-photos"

# ── ตัวแปรทั่วไป (ไม่ลับ) ─────────────────────────────────────────────────
# origin ของหน้าเว็บที่อนุญาตให้เรียก API ได้ ใส่หลายค่าได้โดยคั่นด้วยจุลภาค
# ต้องไม่มี / ต่อท้าย เพราะเบราว์เซอร์ส่ง Origin มาแบบไม่มี /
[vars]
ALLOWED_ORIGIN = "https://topmaha.github.io,https://gemba-safety.pages.dev,http://localhost:8080"
